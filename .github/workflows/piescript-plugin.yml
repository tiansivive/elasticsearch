name: Build piescript plugin

# Builds the x-pack-piescript plugin zip and either:
#   1. Uploads it as a workflow artifact (every push to play/piescript that touches
#      relevant paths), or
#   2. Attaches it to a GitHub Release (when a tag matching piescript-v* is pushed).

on:
  push:
    branches:
      - play/piescript
    tags:
      - 'piescript-v*'
    paths:
      - 'x-pack/plugin/piescript/**'
      - 'x-pack/plugin/esql/**'
      - 'x-pack/plugin/esql-core/**'
      - 'x-pack/plugin/core/**'
      - 'build-tools/**'
      - 'build-tools-internal/**'
      - 'build-conventions/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/piescript-plugin.yml'
  workflow_dispatch:

concurrency:
  group: piescript-plugin-${{ github.ref }}
  # Cancel in-progress branch builds; let tag/release builds finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write  # required for action-gh-release on tag pushes

jobs:
  build:
    name: Assemble plugin zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble piescript plugin
        run: ./gradlew :x-pack:plugin:piescript:assemble

      - name: Locate plugin zip
        id: locate
        run: |
          set -euo pipefail
          ZIP=$(ls x-pack/plugin/piescript/build/distributions/x-pack-piescript-*.zip 2>/dev/null | head -1)
          if [ -z "${ZIP:-}" ]; then
            echo "::error::No plugin zip produced under x-pack/plugin/piescript/build/distributions/"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP" .zip)" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"
          unzip -p "$ZIP" plugin-descriptor.properties | grep -E '^(name|version|elasticsearch.version|java.version)='

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.zip }}
          retention-days: 90
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/piescript-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.zip }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
