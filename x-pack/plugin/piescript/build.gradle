apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-java-rest-test'

esplugin {
    name = 'x-pack-piescript'
    description = 'Typed functional scripting language for Elasticsearch'
    classname = 'org.elasticsearch.xpack.piescript.PiescriptPlugin'
    extendedPlugins = ['x-pack-esql']
}

base {
    archivesName = 'x-pack-piescript'
}

dependencies {
    compileOnly project(path: xpackModule('core'))
    compileOnly project(path: xpackModule('esql'))
    compileOnly project(xpackModule('esql-core'))
    api "org.antlr:antlr4-runtime:${versions.antlr4}"
    testImplementation project(':test:framework')
    javaRestTestImplementation(testArtifact(project(xpackModule('core'))))
}

tasks.named('javaRestTest') {
    usesDefaultDistribution("piescript requires default distribution with x-pack")
}

// ──── ANTLR code generation ────
configurations {
    regenerate
}

dependencies {
    regenerate "org.antlr:antlr4:${versions.antlr4}"
}

String grammarPath = 'src/main/antlr'
String outputPath = 'src/main/java/org/elasticsearch/xpack/piescript/parser'

tasks.register('regenLexer', JavaExec) {
    mainClass = 'org.antlr.v4.Tool'
    classpath = configurations.regenerate
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'user.variant', ''
    args '-Werror',
        '-package', 'org.elasticsearch.xpack.piescript.parser',
        '-listener',
        '-visitor',
        '-o', outputPath,
        "${file(grammarPath)}/PiescriptLexer.g4"
}

tasks.register('regenParser', JavaExec) {
    dependsOn 'regenLexer'
    mainClass = 'org.antlr.v4.Tool'
    classpath = configurations.regenerate
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'user.variant', ''
    args '-Werror',
        '-package', 'org.elasticsearch.xpack.piescript.parser',
        '-listener',
        '-visitor',
        '-lib', outputPath,
        '-o', outputPath,
        "${file(grammarPath)}/PiescriptAntlrParser.g4"
}

tasks.register('regen') {
    dependsOn 'regenParser'
    doLast {
        // Strip 'public' from the lexer (only used by the parser internally).
        // The parser and its context classes stay public so the elab package can access them.
        ant.replaceregexp(
            match: 'public ((interface|class) \\QPiescript\\E)',
            replace: '\\1',
            encoding: 'UTF-8'
        ) {
            fileset(dir: outputPath, includes: 'PiescriptLexer.java')
        }
        // Replace ANTLR's generated @SuppressWarnings with one that also covers this-escape
        ant.replaceregexp(
            match: '@SuppressWarnings\\(\\{"all"[^}]*\\}\\)',
            replace: '@SuppressWarnings({"all", "this-escape", "cast", "warnings", "unchecked", "unused", "CheckReturnValue"})',
            encoding: 'UTF-8'
        ) {
            fileset(dir: outputPath, includes: 'PiescriptAntlrParser*.java')
        }
        // Remove .interp and .tokens files generated into the output dir
        delete fileTree(outputPath) {
            include '*.interp'
            include '*.tokens'
        }
    }
}

// ──── Spotless exclusions for generated files ────
spotless {
    java {
        targetExclude "${outputPath}/PiescriptAntlrParser*.java",
            "${outputPath}/PiescriptLexer.java",
            "${outputPath}/Piescript*Listener.java",
            "${outputPath}/Piescript*Visitor.java",
            "src/main/antlr/.antlr/**/*.java"
    }
}
